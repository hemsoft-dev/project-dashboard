name: Release

# Builds the Windows release on windows-latest, checks the executable (GUI subsystem, icon, version block, starts and
# opens its window) and zips it. On a v* tag it publishes the zip on a GitHub release; 0.x and hyphenated versions
# are pre-releases. Pull requests that touch the packaging run the same build and checks without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/Build-WindowsRelease.ps1
      - crates/dashboard-app/build.rs
      - crates/dashboard-app/src/mark.rs
      - crates/dashboard-app/src/main.rs
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build, check and zip
        shell: pwsh
        run: ./scripts/Build-WindowsRelease.ps1 -OutDir dist -Tag '${{ github.ref_type == 'tag' && github.ref_name || '' }}'

      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-dashboard-windows
          path: dist/
          retention-days: 14

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content dist/version.txt).Trim()
          $notes = "Windows x64. Download project-dashboard-$version-windows-x64.zip, unzip it anywhere and run project-dashboard.exe. See the README for installation and updates."
          # The fixed install note, followed by GitHub's generated list of what changed.
          $flags = @('--title', "Project Dashboard $version", '--notes', $notes, '--generate-notes', '--verify-tag')
          if ($version -match '-' -or $version.StartsWith('0.')) { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*.zip, dist/*.sha256).FullName @flags
