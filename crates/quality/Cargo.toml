[package]
name = "quality"
description = "Quality gates for dashboard-core: per-function coverage, complexity and CRAP (#100). Not shipped."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
# Reads dashboard-core's source to list every function, including ones no test runs, and count its branches.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls"] }
# Line numbers for those functions (outside a proc macro, spans carry them only with this feature).
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }

[lints]
workspace = true
