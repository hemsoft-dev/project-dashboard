[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Versions follow CodexBar's Cargo.toml and Cargo.lock (hemsoft-dev/codexbar), so both apps build on the same GPUI.
[workspace.dependencies]
dashboard-core = { path = "crates/dashboard-core" }
gpui-kit = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The config file (crates/dashboard-core/src/config.rs).
toml = "1"
# The user config folder, per platform.
dirs = "6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
