name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the superseded run; pushes to main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fails on any RustSec advisory in Cargo.lock that deny.toml doesn't accept. It reads the lockfile and fetches the
  # public advisory database and crate index; it uploads nothing. Once is enough: the check covers every target.
  # It also fails on a workflow action that isn't pinned to a full commit (#103, docs/action-pins.md).
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Offline: parses the workflow files as YAML (PyYAML, from Ubuntu's archive if the image lacks it). The tests
      # include a fixture with `actions/checkout@v4` that must fail.
      - name: Action pins
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml; }
          python3 -m unittest discover -s scripts -p 'test_check_action_pins.py' -v
          python3 scripts/check_action_pins.py

      # This commit of the action is v2.1.1, whose Dockerfile pins cargo-deny 0.20.2.
      - name: Advisories (cargo-deny 0.20.2)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
          arguments: --locked
          rust-version: stable

  # No workspace build or target cache: core must declare every feature it uses itself.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent, the base it merges into: the mutation gate diffs them.
          fetch-depth: 2

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      # Each command starts with its own clean target, without GPUI feature unification.
      - name: Standalone core check
        run: cargo check -p dashboard-core --locked --target-dir target/standalone-core-check

      - name: Standalone core test
        run: cargo test -p dashboard-core --locked --target-dir target/standalone-core-test

      # Line coverage and CRAP per function against this platform's baseline (#100, docs/quality.md). Runs at review
      # on pull requests and again for the merged revision on main.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1

      # pwsh, like the test steps above, not bash. Under Git Bash the filtered-token tests in config_atomic_73 failed
      # on Windows (the token could assign the Administrators owner and write where it shouldn't). Git Bash's runtime
      # enables backup and restore privileges on the token its children inherit.
      # The coverage toolchain is pinned: another rustc maps coverage to lines differently, so a runner image with a
      # newer stable moved the numbers without a code change (main at 0e3722b). The baselines in crates/quality are
      # measured with this version; change both together (docs/quality.md).
      - name: Core coverage and CRAP
        shell: pwsh
        env:
          COVERAGE_TOOLCHAIN: 1.99.0
        run: |
          $platform = if ($IsWindows) { 'windows' } else { 'linux' }
          rustup toolchain install $env:COVERAGE_TOOLCHAIN --profile minimal --component llvm-tools-preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/quality | Out-Null
          $env:CARGO_TARGET_DIR = 'target/core-coverage'
          cargo "+$env:COVERAGE_TOOLCHAIN" llvm-cov -p dashboard-core --locked --lcov `
            --output-path "target/quality/core-$platform.lcov"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_TARGET_DIR
          cargo run -p quality --locked --target-dir target/quality-tool -- crap --src crates/dashboard-core/src `
            --lcov "target/quality/core-$platform.lcov" --platform $platform --revision (git rev-parse HEAD) `
            --baseline "crates/quality/baselines/crap-$platform.json" --out target/quality
          exit $LASTEXITCODE

      - name: Upload coverage and CRAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-crap-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/quality/
          if-no-files-found: warn
          retention-days: 30

      # Every mutant in the pull request's changed lines of the examined files must be caught (#101, docs/quality.md).
      # Linux only: the mutation policy and its platform exclusions are measured there. The full run is mutants.yml.
      - name: Install cargo-mutants
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants@27.1.0

      - name: Mutants in the changed lines
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # The gate itself: an asserting fixture passes it and the same fixture without its assertion fails it.
          cargo test -p quality --locked --test mutants_fixture -- --ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Invoke-Mutants.ps1 -Mode diff -Base (git rev-parse 'HEAD^1') -Out target/mutants -Jobs 2
          exit $LASTEXITCODE

      - name: Upload the mutation report
        if: always() && runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-diff-${{ github.event.pull_request.head.sha }}
          path: |
            target/mutants/*.md
            target/mutants/*.json
            target/mutants/changes.diff
            target/mutants/mutants.out/
          if-no-files-found: warn
          retention-days: 30

  # Branch coverage of dashboard-core beside its line coverage (#110, docs/quality.md). It needs a nightly rustc
  # (-Z coverage-options=branch): stable 1.100.0 rejects the option. So it runs in its own job on a pinned nightly,
  # reports and gates nothing, and is not a required check. The build, the required checks and the line-coverage gate
  # stay on stable and rustc 1.99.0. The job fails only when the report can't be made, including an LCOV without
  # branch records. Linux only: branch counts are reported, not compared against a per-platform baseline.
  branch-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1

      # The nightly is pinned by date: a newer one may count branches differently or drop the unstable option.
      - name: Core branch coverage report
        shell: pwsh
        env:
          BRANCH_TOOLCHAIN: nightly-2026-10-22
        run: |
          rustup toolchain install $env:BRANCH_TOOLCHAIN --profile minimal --component llvm-tools-preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/branch-quality | Out-Null
          $env:CARGO_TARGET_DIR = 'target/core-branch-coverage'
          cargo "+$env:BRANCH_TOOLCHAIN" llvm-cov -p dashboard-core --locked --branch --lcov `
            --output-path target/branch-quality/core-linux.lcov
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_TARGET_DIR
          cargo run -p quality --locked --target-dir target/quality-tool -- crap --src crates/dashboard-core/src `
            --lcov target/branch-quality/core-linux.lcov --platform linux --revision (git rev-parse HEAD) `
            --report-only --require-branches --out target/branch-quality
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content target/branch-quality/crap-linux.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload the branch coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-branches-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/branch-quality/
          if-no-files-found: warn
          retention-days: 30

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GPUI's X11 and Wayland backends link these; Mesa's software Vulkan (lavapipe) renders the screenshots.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            mesa-vulkan-drivers

      # rust-toolchain.toml pins stable with rustfmt and clippy; rustup installs it on first use.
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the headless UI tests (in-process GPUI test windows; no desktop needed).
      - name: Test
        run: cargo test --workspace --locked

      # Repeated refresh latency and retained resources in an in-process test window (#102, docs/qualification.md):
      # the workload must stay within its budgets, and the same workload with a source that leaks a thread and memory
      # per fetch must fail them. Each run writes its report into a folder emptied first.
      - name: Refresh qualification
        shell: pwsh
        env:
          PERF_DIR: ${{ github.workspace }}/target/perf
        run: |
          $env:PERF_REVISION = (git rev-parse HEAD)
          if (Test-Path $env:PERF_DIR) { Remove-Item -Recurse -Force $env:PERF_DIR }
          cargo test -p dashboard-app --locked qualification_repeated -- --ignored --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PERF_FIXTURE = 'leak'
          cargo test -p dashboard-app --locked qualification_repeated -- --ignored --test-threads=1
          if ($LASTEXITCODE -eq 0) { Write-Error 'The leaking fixture passed the qualification.'; exit 1 }
          $leak = Get-ChildItem "$env:PERF_DIR/refresh-*-leak.json" | Get-Content -Raw | ConvertFrom-Json
          if ($leak.report.revision -ne $env:PERF_REVISION -or $leak.failures.Count -eq 0) {
            Write-Error 'The leaking fixture failed without a report of its own naming the violations.'
            exit 1
          }
          Write-Output "The leaking fixture failed as it must: $($leak.failures -join '; ')"
          # The expected failure left a nonzero LASTEXITCODE, which the pwsh wrapper would return.
          exit 0

      - name: Upload the refresh qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refresh-qualification-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/perf/
          if-no-files-found: warn
          retention-days: 30

      # The pull-request screenshots (src/captures.rs), rendered offscreen with the build above. Download them from
      # the run's artifacts and attach them to the PR's Validation section.
      - name: Screenshots
        if: runner.os == 'Linux'
        # Absolute: cargo runs the test from the crate's folder, so a relative CAPTURE_DIR would land there.
        run: CAPTURE_DIR="$GITHUB_WORKSPACE/captures" cargo test -p dashboard-app --locked captures -- --ignored

      - name: Upload screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures
          path: captures/
          if-no-files-found: error
