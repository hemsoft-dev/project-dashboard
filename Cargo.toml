[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.12.0"
license = "MIT"
publish = false

# Versions follow CodexBar's Cargo.toml and Cargo.lock (hemsoft-dev/codexbar), so both apps build on the same GPUI.
[workspace.dependencies]
dashboard-core = { path = "crates/dashboard-core" }
gpui-kit = "0.8.0"
serde = { version = "1", features = ["derive"] }
# Timestamps for last activity, as CodexBar pins it.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1"
# The config file (crates/dashboard-core/src/config.rs).
toml = "1"
# The user config folder, per platform.
dirs = "6"
# Reads T3 Code's state database, read-only, to link a checkout to its thread (#15). Bundled, so no system SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
