[package]
name = "dashboard-core"
description = "Project Dashboard data model: the board of repositories and their gh-x status. No UI."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
chrono.workspace = true
rusqlite.workspace = true
reqwest.workspace = true

# Gives the stored write token an owner-only ACL (src/write.rs). Already in the lock through GPUI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[lints]
workspace = true
